[project]
name = "openocd-mcp"
version = "0.1.0"
description = "MCP server for OpenOCD flashing and debugging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.12.2",
]

[project.scripts]
openocd-mcp = "openocd_mcp.server:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv]
package = true
